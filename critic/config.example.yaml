# critic server defaults. Settings set via /critic:settings override these.

codex:
  # model left empty = let the Codex CLI pick the active subscription's model
  model: ""

pi:
  # pi handles the third reviewer slot. Provider/model are defaults; skills
  # may override per-call (e.g. the manuscript skill asks the user to pick).
  provider: google
  model: ""

claude:
  # Used only by the invoke-claude tool (headless `claude -p`), which exists
  # so a non-Claude leader (Codex CLI, etc.) can dispatch Claude as a
  # reviewer. Inside cowork, skills use Task subagents and this is ignored.
  # Empty = CLI default model.
  model: ""
